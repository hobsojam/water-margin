name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install package with dev extras
        run: pip install -e ".[dev]" pip-audit

      - name: Audit dependencies for known CVEs
        run: pip-audit

      - name: Run tests
        run: pytest
